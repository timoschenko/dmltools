version: "2"

formatters:
  enable:
    - gofmt
    - golines
  settings:
    golines:
      max-len: 80

linters:
  disable:
    - staticcheck
  enable:
    - bidichk
    - copyloopvar
    - durationcheck
    # - funlen
    - gosec
    - makezero
    - mirror
    - modernize
    - intrange
    - prealloc
    - reassign
    - unconvert
    - usestdlibvars
    - usetesting
    # - lll
  settings:
    lll:
      line-length: 80
    funlen:
      ignore-comments: true
  exclusions:
    rules:
      - linters:
          - funlen
        path: _test\.go
