name: Pre-commit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, trunk]

jobs:
  resolve-matrix:
    name: Resolve Go Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Go Versions
        id: resolve
        timeout-minutes: 2
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          import sys
          import urllib.request

          def parse_version(v_str):
              m = re.search(r'(\d+)\.(\d+)', v_str)
              if not m:
                  return (0, 0)
              return (int(m.group(1)), int(m.group(2)))

          output_file = os.environ.get("GITHUB_OUTPUT")

          def set_matrix_output(matrix_dict):
              json_str = json.dumps(matrix_dict)
              print(f"Setting matrix output: {json_str}", file=sys.stderr)
              if output_file:
                  with open(output_file, "a", encoding="utf-8") as f:
                      f.write(f"matrix={json_str}\n")
              else:
                  print(f"::set-output name=matrix::{json_str}")

          default_matrix = {"go": ["go.mod"]}

          # 1. Parse go.mod
          mod_ver = (0, 0)
          try:
              with open("go.mod", "r", encoding="utf-8") as f:
                  for line in f:
                      line = line.strip()
                      if line.startswith("go "):
                          parts = line.split()
                          if len(parts) >= 2:
                              mod_ver = parse_version(parts[1])
                              break
          except Exception as e:
              print(f"Warning: failed to read go.mod: {e}", file=sys.stderr)

          if mod_ver == (0, 0):
              set_matrix_output(default_matrix)
              sys.exit(0)

          # 2. Fetch go.dev releases
          try:
              req = urllib.request.Request(
                  "https://go.dev/dl/?mode=json",
                  headers={"User-Agent": "dmlint-ci-matrix-resolver"}
              )
              with urllib.request.urlopen(req, timeout=10) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
          except Exception as e:
              print(f"Warning: failed to fetch Go releases from go.dev: {e}", file=sys.stderr)
              set_matrix_output(default_matrix)
              sys.exit(0)

          stables = [r for r in data if r.get("stable", False)]
          if not stables:
              set_matrix_output(default_matrix)
              sys.exit(0)

          stable_ver = parse_version(stables[0]["version"])
          oldstable_ver = (0, 0)
          for r in stables[1:]:
              ver = parse_version(r["version"])
              if ver < stable_ver:
                  oldstable_ver = ver
                  break

          go_matrix = ["go.mod"]
          if oldstable_ver > mod_ver:
              go_matrix.append("oldstable")
          if stable_ver > mod_ver and stable_ver != oldstable_ver:
              go_matrix.append("stable")

          set_matrix_output({"go": go_matrix})
          EOF

  pre-commit:
    name: Build, Test & Pre-commit (${{ matrix.go }})
    needs: resolve-matrix
    runs-on: ubuntu-latest
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java (for ANTLR)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go (${{ matrix.go }})
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          cache: true

      - name: Set up Python
        if: matrix.go == 'go.mod'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache ANTLR jars and pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/deps/*.jar
            ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'Makefile') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install stringer
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/tools/cmd/stringer@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test Tools (make test-tools)
        timeout-minutes: 3
        run: make test-tools

      - name: Generate (make generate)
        timeout-minutes: 2
        run: make generate

      - name: Build (make release)
        timeout-minutes: 3
        run: make release

      - name: Test (make test)
        timeout-minutes: 6
        run: make test

      - name: Test Ndebug (make test-ndebug)
        timeout-minutes: 6
        run: make test-ndebug

      # Run lint only for target version
      - name: Install golangci-lint
        if: matrix.go == 'go.mod'
        timeout-minutes: 5
        run: |
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0

      - name: Install pre-commit
        if: matrix.go == 'go.mod'
        timeout-minutes: 5
        run: pip install pre-commit

      - name: Run pre-commit hooks
        if: matrix.go == 'go.mod'
        timeout-minutes: 5
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run license check
        if: matrix.go == 'go.mod'
        timeout-minutes: 2
        run: make license-check
