name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: Release with GoReleaser
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java (for ANTLR)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache ANTLR jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/deps/*.jar
          key: antlr-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            antlr-${{ runner.os }}-

      - name: Install stringer
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/tools/cmd/stringer@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate parser code
        run: make generate

      - name: Run test suite (with debug assertions enabled)
        run: make test

      - name: Run test suite (with ndebug / release assertions disabled)
        run: make test-ndebug

      - name: Generate test coverage report
        run: make coverage

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
